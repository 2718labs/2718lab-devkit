name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-runtime:
    name: MCP runtime (Python 3.11)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure task-local runtime storage
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP '2718lab-devkit-task\mcp-runtime'
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $root 'tmp'), `
            (Join-Path $root 'pycache'), `
            (Join-Path $root 'uv-cache') | Out-Null
          @(
            "CODEX_TASK_TEMP=$root"
            "TEMP=$(Join-Path $root 'tmp')"
            "TMP=$(Join-Path $root 'tmp')"
            "TMPDIR=$(Join-Path $root 'tmp')"
            "PYTHONPYCACHEPREFIX=$(Join-Path $root 'pycache')"
            "UV_CACHE_DIR=$(Join-Path $root 'uv-cache')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Validate lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --all-groups

      - name: Focused Ruff check
        run: >-
          uv run --locked ruff check
          devkit_atlas/service.py
          devkit_runtime/atlas_acceptance.py
          orchestrator/service.py
          project_index/checkpoints.py
          project_index/service.py
          project_index/store.py

      - name: Focused Ruff format check
        run: >-
          uv run --locked ruff format --check
          devkit_atlas/service.py
          devkit_runtime/atlas_acceptance.py
          orchestrator/service.py
          project_index/checkpoints.py
          project_index/service.py
          project_index/store.py

      - name: Server type check
        run: uv run --locked pyright server.py

      - name: Server syntax check
        run: uv run --locked python -m py_compile server.py

      - name: Test
        run: uv run --locked pytest -q

  astrbot-extension:
    name: AstrBot extension (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/astrbot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Validate lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Pyright
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked pytest -q

  fast-lane:
    name: Fast Lane contracts (Python 3.11)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skills/work-methodology
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure task-local runtime storage
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $root = 'D:\bun\tmp\codex\2718lab-devkit-ci\fast-lane'
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $root 'tmp'), `
            (Join-Path $root 'pycache'), `
            (Join-Path $root 'pip-cache') | Out-Null
          New-Item -ItemType Directory -Force -Path `
            'D:\bun\tmp\codex\2718-devkit\worktrees\atlas12b-team-efficiency' | Out-Null
          @(
            "CODEX_TASK_TEMP=$root"
            "TEMP=$(Join-Path $root 'tmp')"
            "TMP=$(Join-Path $root 'tmp')"
            "TMPDIR=$(Join-Path $root 'tmp')"
            "PYTHONPYCACHEPREFIX=$(Join-Path $root 'pycache')"
            "PIP_CACHE_DIR=$(Join-Path $root 'pip-cache')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Fast Lane test tools
        run: python -m pip install --disable-pip-version-check pytest ruff==0.16.1

      - name: Ruff check
        run: >-
          python -m ruff check --select E,F --ignore E501
          scripts/team_efficiency.py
          scripts/fastlane_quota_balance.py
          tests/test_team_efficiency.py
          tests/test_fastlane_quota_balance.py

      - name: Ruff format check
        run: >-
          python -m ruff format --check
          scripts/team_efficiency.py
          scripts/fastlane_quota_balance.py
          tests/test_team_efficiency.py
          tests/test_fastlane_quota_balance.py

      - name: Syntax check
        run: >-
          python -m py_compile
          scripts/team_efficiency.py
          scripts/fastlane_quota_balance.py

      - name: Test
        run: >-
          python -m pytest -q
          tests/test_team_efficiency.py
          tests/test_fastlane_quota_balance.py

  primary-artifact:
    name: Build primary allowlisted artifact
    runs-on: ubuntu-latest
    needs: [mcp-runtime, astrbot-extension, fast-lane]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build deterministic artifact
        id: build
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/2718lab-devkit-${GITHUB_SHA}.zip"
          python .codex-plugin/build_main_artifact.py \
            --plugin-root . \
            --allowlist .codex-plugin/main-artifact-allowlist.json \
            --output "${output}"
          unzip -t "${output}"
          sha256sum "${output}" | tee "${output}.sha256"
          echo "path=${output}" >> "${GITHUB_OUTPUT}"

      - name: Upload primary artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2718lab-devkit-primary-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.path }}
            ${{ steps.build.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14
