name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New v-prefixed release tag to create from the current main commit
        required: true
        type: string
      channel:
        description: Release channel; prerelease requires a hyphenated version
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - production

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate main commit and release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      channel: ${{ steps.validate.outputs.channel }}
      commit: ${{ steps.validate.outputs.commit }}
      tag_state: ${{ steps.validate.outputs.tag_state }}
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Validate release boundary, versions, and changelog
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          RELEASE_TAG_STATE=new
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "${GITHUB_SHA}"
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft >/dev/null 2>&1; then
              if [ "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != "true" ]; then
                echo "release tag already has a published release: ${RELEASE_TAG}" >&2
                exit 1
              fi
            fi
            RELEASE_TAG_STATE=resume
          fi
          export RELEASE_TAG_STATE
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"].strip()
          channel = os.environ["RELEASE_CHANNEL"].strip()
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"invalid release tag: {tag!r}")
          if channel not in {"prerelease", "production"}:
              raise SystemExit(f"invalid release channel: {channel!r}")

          version = tag[1:]
          prerelease = "-" in version
          if prerelease != (channel == "prerelease"):
              raise SystemExit("release channel must match whether the version is prerelease")

          plugin = json.loads(Path(".codex-plugin/plugin.json").read_text())
          if plugin.get("version") != version:
              raise SystemExit(
                  f".codex-plugin/plugin.json version {plugin.get('version')!r} "
                  f"does not match {version!r}"
              )

          with Path("mcp-tools/pyproject.toml").open("rb") as handle:
              mcp_version = tomllib.load(handle)["project"]["version"]

          def pep440(value: str) -> str:
              return re.sub(r"-(?=(?:a|b|rc|post|dev)\d)", "", value)

          if pep440(mcp_version) != pep440(version):
              raise SystemExit(
                  f"mcp-tools version {mcp_version!r} does not match {version!r}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[v?{re.escape(version)}\]", changelog, re.M):
              raise SystemExit(f"CHANGELOG.md has no entry for {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"tag={tag}\nversion={version}\n"
                  f"prerelease={str(prerelease).lower()}\nchannel={channel}\n"
                  f"commit={os.environ['GITHUB_SHA']}\n"
                  f"tag_state={os.environ['RELEASE_TAG_STATE']}\n"
              )
          print(f"validated release {tag} from {os.environ['GITHUB_SHA']}")
          PY

  mcp-runtime:
    name: Re-run MCP runtime
    needs: metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-tools
    steps:
      - name: Check out validated main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Configure MCP task-local runtime storage
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is required for hosted task-local storage' }
          $root = Join-Path $env:RUNNER_TEMP '2718lab-devkit-release\mcp-runtime'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'tmp'), (Join-Path $root 'pycache'), (Join-Path $root 'uv-cache') | Out-Null
          @(
            "CODEX_TASK_TEMP=$root"
            "TEMP=$(Join-Path $root 'tmp')"
            "TMP=$(Join-Path $root 'tmp')"
            "TMPDIR=$(Join-Path $root 'tmp')"
            "PYTHONPYCACHEPREFIX=$(Join-Path $root 'pycache')"
            "UV_CACHE_DIR=$(Join-Path $root 'uv-cache')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28

      - name: Check MCP runtime
        shell: bash
        run: |
          uv lock --check
          uv sync --locked --all-groups
          uv run --locked ruff check \
            devkit_atlas/service.py \
            devkit_continuity \
            devkit_runtime/atlas_acceptance.py \
            orchestrator/service.py \
            project_index/checkpoints.py \
            project_index/service.py \
            project_index/store.py
          uv run --locked ruff format --check \
            devkit_atlas/service.py \
            devkit_continuity \
            devkit_runtime/atlas_acceptance.py \
            orchestrator/service.py \
            project_index/checkpoints.py \
            project_index/service.py \
            project_index/store.py
          uv run --locked pyright server.py devkit_continuity
          uv run --locked python -m py_compile server.py
          uv run --locked pytest -q

  primary-artifact:
    name: Re-run primary artifact contract
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Check Linux primary artifact contract
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q mcp-tools/tests/test_primary_artifact.py

  fast-lane:
    name: Re-run Fast Lane contracts
    needs: metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-tools/devkit_fastlane
    steps:
      - name: Check out validated main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Configure task-local runtime storage
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is required for hosted task-local storage' }
          $root = Join-Path $env:RUNNER_TEMP '2718lab-devkit-release\fast-lane'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'tmp'), (Join-Path $root 'pycache'), (Join-Path $root 'pip-cache') | Out-Null
          @(
            "CODEX_TASK_TEMP=$root"
            "TEMP=$(Join-Path $root 'tmp')"
            "TMP=$(Join-Path $root 'tmp')"
            "TMPDIR=$(Join-Path $root 'tmp')"
            "PYTHONPYCACHEPREFIX=$(Join-Path $root 'pycache')"
            "PIP_CACHE_DIR=$(Join-Path $root 'pip-cache')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Fast Lane test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.1

      - name: Ruff check
        run: >-
          python -m ruff check --select E,F --ignore E501
          scripts/team_efficiency.py
          scripts/fastlane_routing.py
          tests/test_team_efficiency.py
          tests/test_fastlane_routing.py

      - name: Ruff format check
        run: >-
          python -m ruff format --check
          scripts/team_efficiency.py
          scripts/fastlane_routing.py
          tests/test_team_efficiency.py
          tests/test_fastlane_routing.py

      - name: Syntax check
        run: >-
          python -m py_compile
          scripts/team_efficiency.py
          scripts/fastlane_routing.py

      - name: Test
        run: >-
          python -m pytest -q
          tests/test_team_efficiency.py
          tests/test_fastlane_routing.py

  publish:
    name: Create GitHub Release
    needs: [metadata, mcp-runtime, primary-artifact, fast-lane]
    runs-on: ubuntu-latest
    environment: ${{ needs.metadata.outputs.channel }}
    permissions:
      contents: write
    steps:
      - name: Check out validated main revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28

      - name: Build allowlisted artifact
        id: build
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/2718lab-devkit-${RELEASE_VERSION}.zip"
          python .codex-plugin/build_main_artifact.py \
            --plugin-root . \
            --allowlist .codex-plugin/main-artifact-allowlist.json \
            --output "${output}"
          unzip -t "${output}"
          sha256sum "${output}" | tee "${output}.sha256"
          echo "path=${output}" >> "${GITHUB_OUTPUT}"

      - name: Upload primary release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 2718lab-devkit-primary-${{ needs.metadata.outputs.version }}
          path: |
            ${{ steps.build.outputs.path }}
            ${{ steps.build.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Extract release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python - <<'PY' > "${RUNNER_TEMP}/release-notes.md"
          import os
          import re
          from pathlib import Path

          version = re.escape(os.environ["RELEASE_VERSION"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[v?{version}\].*?\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          if not match:
              raise SystemExit("release notes not found")
          print(match.group(1).strip())
          PY

      - name: Create immutable annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_TAG_STATE: ${{ needs.metadata.outputs.tag_state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "${RELEASE_COMMIT}" = "$(git rev-parse origin/main)"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            test "${RELEASE_TAG_STATE}" = "resume"
          else
            test "${RELEASE_TAG_STATE}" = "new"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "${RELEASE_TAG}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}"
          fi

          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "${RELEASE_COMMIT}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          if [ "${RELEASE_TAG_STATE}" = "resume" ] && gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "release recovery requires a draft release" >&2
              exit 1
            fi
          fi

      - name: Create or resume draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "${RELEASE_COMMIT}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          release_args=()
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "true"
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              "${release_args[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              "${release_args[@]}"
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          ARTIFACT: ${{ steps.build.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "${ARTIFACT}" \
            "${ARTIFACT}.sha256" \
            --clobber

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${release_args[@]}"
