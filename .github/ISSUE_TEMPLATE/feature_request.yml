name: Feature request
description: Propose an improvement to the shared 2718lab engineering infrastructure
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        2718lab DevKit is shared engineering infrastructure rather than a single-purpose bug-fixing plugin. Describe the reusable capability or workflow you need and who benefits from it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Project index
        - Durable workflow orchestration
        - Shared Agent roles
        - Bundled engineering skill
        - Host integration
        - Specialized workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering task is currently difficult, unsafe, or repetitive?
      placeholder: Describe the users, repository context, and current limitation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and a small acceptance example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any existing DevKit capability or workaround you evaluated.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for the same request.
          required: true
        - label: I did not include credentials, private repository content, or personal data.
          required: true
