name: "Feature request"
description: Propose a bounded improvement to the DevKit.
title: "[Feature] "
labels: ["type/feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What user problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful contract and its boundaries.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable tests or behavior that would prove it works.
    validations:
      required: true

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's Code of Conduct.
          required: true
