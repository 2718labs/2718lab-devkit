name: "Documentation improvement"
description: Report inaccurate, missing, or confusing documentation.
title: "[Docs] "
labels: ["type/docs"]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Give the file, section, or URL.
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Explain the ambiguity or missing information.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested wording or example
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's Code of Conduct.
          required: true
