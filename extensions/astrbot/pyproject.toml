[project]
name = "2718lab-devkit-astrbot"
version = "1.0.0rc1"
description = "Standalone AstrBot plugin scaffolding and static validation."
readme = "README.md"
authors = [{ name = "2718lab" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devkit-astrbot = "devkit_astrbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devkit_astrbot"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
