# 应用/脚本模板(flat-layout 允许:只用 `uv run` 跑,不发布到 PyPI、不会被外部 import 的项目用这个)
# 使用方法:复制本文件到新项目根目录,替换占位符;代码可以直接放仓库根目录或简单子目录,不强制 src/。

[project]
name = "<app-name>"
version = "0.1.0"                    # 应用内部用,同样必须合法 PEP 440;不发布到公共索引也不要偷懒写 "v1.0"
description = "一句话描述这个应用。"
requires-python = ">=3.10"
dependencies = [
    # "typer>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
]

# 这是只运行、不构建 wheel、不发布到 PyPI 的应用。
# 将来需要作为包安装或发布时,删除这一节并改用受支持的 [build-system]。
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["."]                      # flat-layout:检查整个仓库,按需自行加 exclude
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
