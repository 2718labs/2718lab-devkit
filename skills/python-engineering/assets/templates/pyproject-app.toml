# 应用/脚本模板(flat-layout 允许:只用 `uv run` 跑,不发布到 PyPI、不会被外部 import 的项目用这个)
# 使用方法:复制本文件到新项目根目录,替换占位符;代码可以直接放仓库根目录或简单子目录,不强制 src/。

[project]
name = "<app-name>"
version = "0.1.0"                    # 应用内部用,同样必须合法 PEP 440;不发布到公共索引也不要偷懒写 "v1.0"
description = "一句话描述这个应用。"
requires-python = ">=3.10"
dependencies = [
    # "typer>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
]

# 应用/脚本项目通常不需要真正 build 成 wheel 发布,但 uv 项目仍需声明 [build-system] 才能被识别为可安装包。
# 没有构建脚本/C 扩展时同样用 uv_build,不要因为"是应用"就随手写别的后端。
[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["."]                      # flat-layout:检查整个仓库,按需自行加 exclude
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
