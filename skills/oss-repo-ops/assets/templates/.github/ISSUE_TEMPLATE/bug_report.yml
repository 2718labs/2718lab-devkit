name: Bug 反馈
description: 报告插件的一个问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全下面的信息——AstrBot 插件的 bug 常常是「特定版本 / 特定平台适配器」独有的,缺了这些几乎无法定位。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: metadata.yaml 里的 version(如 v1.2.0)
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      description: AstrBot WebUI 右下角或「关于」页可见
      placeholder: v4.26.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台适配器
      description: 在哪个消息平台上复现的
      multiple: true
      options:
        - aiocqhttp (QQ / OneBot)
        - QQ 官方接口 (qq_official)
        - 微信 (gewechat / wechatpadpro 等)
        - Telegram
        - Discord
        - 飞书 / Lark
        - 钉钉
        - 企业微信
        - 其他(在下方描述里注明)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述与复现步骤
      description: 期望行为、实际行为、以及一步步怎么触发
      placeholder: |
        1. 发送指令 …
        2. 期望 …
        3. 实际 …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: AstrBot 控制台 / WebUI 日志(粘贴时注意脱敏,去掉 token、手机号等)
      render: shell
    validations:
      required: false
