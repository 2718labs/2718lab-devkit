# 最小 CI —— 复制到插件/工具仓库的 .github/workflows/ci.yml
# 只做“能加载 + 风格达标”的冒烟级校验;工具链选型细节(ruff 规则集、pytest 结构、
# 类型检查)让位给 python-engineering skill。action 版本号不要自由发挥,照抄本文件。
name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Import/compile smoke test
        # 插件入口通常是 main.py;非插件项目改成对应包目录
        run: python -m py_compile main.py
      - name: Tests (non-blocking until suite exists)
        # 有真实测试后去掉 “|| true” 让失败能挡住合并
        run: pytest -q || true
