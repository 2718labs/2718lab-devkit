# 起步模板 pyproject.toml —— 二选一,不要两段依赖同时留着。
# 详细依赖钉法说明见 references/packaging-and-integration.md 第 1 节。

[project]
name = "my-mcp-server"
version = "0.1.0"
description = "My MCP server"
requires-python = ">=3.10"

# ---- 选 (A) 官方 SDK 内置 v1.x 时,用这一段(配 server_sdk.py) ----
dependencies = [
    "mcp[cli]>=1,<2",   # 上界必须写,防止解析到 v2 alpha(MCPServer,breaking API)
]

# ---- 选 (B) 独立版 3.x 时,删掉上面那段,改用这一段(配 server_standalone.py) ----
# dependencies = [
#     "fastmcp>=3.4,<4",   # 钉在实际测试过的 3.x 线;用了 CurrentContext()/get_context() 等特性时,下界要覆盖对应版本门槛
# ]

# 注:MCP server 正常靠 `mcp dev/run`(A)或 `fastmcp run`(B)拉起,不是靠 console-script 入口点。
# 两个模板 server 文件都没有定义 main() 可调用对象,故这里不写 [project.scripts]——
# 如果确实需要打包成命令行工具,先在 server 文件里加 `def main(): mcp.run()` 并在
# `if __name__ == "__main__":` 里调用它,再回来加这段:
# [project.scripts]
# my-mcp-server = "my_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
